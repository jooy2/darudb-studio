name: build

# Makes the installers, each on the system it is for, and keeps them as the
# run's artifacts. It publishes nothing. Started by hand from the Actions tab,
# or by pushing a tag `v<version>`.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Build for ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            script: build:mac
          - os: windows-latest
            name: Windows
            script: build:win
          - os: ubuntu-latest
            name: Linux
            script: build:linux

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install snapcraft
        if: runner.os == 'Linux'
        run: sudo snap install snapcraft --classic

      # The signing secrets are empty until they are set in the repository's
      # settings, and the installers are then built unsigned
      - name: Build the installers
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # A packed app no longer runs as plain Node.js, so the app itself is asked
      # whether it loads the engine. It opens no window and exits with 1 when not.
      - name: Check the packed apps (macOS)
        if: runner.os == 'macOS'
        run: |
          for folder in release/*/mac-arm64 release/*/mac-universal; do
            "$folder/DaruDB Studio.app/Contents/MacOS/DaruDB Studio" --self-check
          done

      - name: Check the packed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem 'release/*/win-unpacked/DaruDB Studio.exe' | Select-Object -First 1
          $run = Start-Process -FilePath $app.FullName -ArgumentList '--self-check' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The self-check failed with exit code $($run.ExitCode)" }

      - name: Check the packed app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q --no-install-recommends xvfb
          xvfb-run --auto-servernum release/*/linux-unpacked/darudb-studio --self-check --no-sandbox

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: |
            release/*/*.dmg
            release/*/*.exe
            release/*/*.zip
            release/*/*.appx
            release/*/*.snap
            release/*/*.deb
            release/*/*.rpm
          if-no-files-found: error
          retention-days: 14
